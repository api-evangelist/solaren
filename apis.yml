aid: solaren
name: Solaren
description: >-
  Solaren is a combination energy and aerospace company headquartered in Manhattan Beach,
  California, founded in 2001 by a team of satellite engineers and space scientists. Solaren
  designs, develops, integrates, deploys and operates space solar power (SSP) plants: solar
  arrays on a patented lightweight solar power satellite in geosynchronous orbit convert
  sunlight to electricity, convert that electricity to radio-frequency power, and beam it to
  an earth receiving station that returns it to the grid as baseload power. The company's
  business model is to own and operate its SSP plants and sell continuous, zero-emission
  electricity to utility and government customers; it signed the world's first power purchase
  agreement for space solar electricity, with Pacific Gas & Electric. Solaren is a hardware
  and energy-generation company and publishes no public developer program, API, or
  machine-readable API contract.
